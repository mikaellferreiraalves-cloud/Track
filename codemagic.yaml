workflows:
  android-debug:
    name: Android Debug Build
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Generate Gradle Wrapper
        script: |
          gradle wrapper --gradle-version 9.7.0
      - name: Build debug APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
